<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="Geist, Inter, Segoe UI, sans-serif">
  <title>Цепочка запросов страницы результатов</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #F2F2F2; }
      .s { font-size: 12px; fill: #A0A0A8; }
      .k { font-size: 12px; fill: #FF1E10; font-family: 'JetBrains Mono', Consolas, monospace; }
      .a { stroke: #8A8A93; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="680" height="430" rx="18" fill="#141418"/>

  <rect x="240" y="20" width="200" height="56" rx="12" fill="#1F1F25" stroke="#3A3A42"/>
  <text class="t" x="340" y="42" text-anchor="middle">Сезон</text>
  <text class="s" x="340" y="62" text-anchor="middle">селект в шапке</text>

  <line class="a" x1="340" y1="78" x2="340" y2="108" marker-end="url(#arrow)"/>
  <text class="k" x="352" y="98">year</text>

  <rect x="240" y="110" width="200" height="56" rx="12" fill="#2A1614" stroke="#E10600"/>
  <text class="t" x="340" y="132" text-anchor="middle">/meetings</text>
  <text class="s" x="340" y="152" text-anchor="middle">селект этапа</text>

  <line class="a" x1="340" y1="168" x2="340" y2="198" marker-end="url(#arrow)"/>
  <text class="k" x="352" y="188">meeting_key</text>

  <rect x="240" y="200" width="200" height="56" rx="12" fill="#2A1614" stroke="#E10600"/>
  <text class="t" x="340" y="222" text-anchor="middle">/sessions</text>
  <text class="s" x="340" y="242" text-anchor="middle">табы сессий</text>

  <path class="a" d="M340 258 L340 290 M107.5 290 L572.5 290"/>
  <text class="k" x="352" y="280">session_key</text>
  <line class="a" x1="107.5" y1="290" x2="107.5" y2="318" marker-end="url(#arrow)"/>
  <line class="a" x1="262.5" y1="290" x2="262.5" y2="318" marker-end="url(#arrow)"/>
  <line class="a" x1="417.5" y1="290" x2="417.5" y2="318" marker-end="url(#arrow)"/>
  <line class="a" x1="572.5" y1="290" x2="572.5" y2="318" marker-end="url(#arrow)"/>

  <rect x="40" y="320" width="135" height="56" rx="12" fill="#13261C" stroke="#30D158"/>
  <text class="t" x="107.5" y="342" text-anchor="middle">/session_result</text>
  <text class="s" x="107.5" y="362" text-anchor="middle">основа строк</text>

  <rect x="195" y="320" width="135" height="56" rx="12" fill="#13261C" stroke="#30D158"/>
  <text class="t" x="262.5" y="342" text-anchor="middle">/drivers</text>
  <text class="s" x="262.5" y="362" text-anchor="middle">имя, команда</text>

  <rect x="350" y="320" width="135" height="56" rx="12" fill="#13261C" stroke="#30D158"/>
  <text class="t" x="417.5" y="342" text-anchor="middle">/stints</text>
  <text class="s" x="417.5" y="362" text-anchor="middle">шины, пит-стопы</text>

  <rect x="505" y="320" width="135" height="56" rx="12" fill="#13261C" stroke="#30D158"/>
  <text class="t" x="572.5" y="342" text-anchor="middle">/laps</text>
  <text class="s" x="572.5" y="362" text-anchor="middle">лучший круг</text>

  <text class="s" x="340" y="406" text-anchor="middle">Четыре ответа склеиваются в строку по <tspan class="k">driver_number</tspan></text>
</svg>
